name: Release

# Triggered EITHER by a tag push (git push origin v0.1.0) or manually
# from the Actions tab → Release → Run workflow → type "v0.1.0".
# Both paths build the same artifacts and upload them to a release
# named after the chosen tag (action-gh-release creates the tag if it
# doesn't exist yet).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (e.g. v0.1.0). Created on the current branch if it doesn't exist."
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  # Opt JS-based actions into Node 24 — silences the Node 20 deprecation
  # notice GitHub started showing in Sep 2025. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build standalone binaries + Roblox plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing as: ${TAG}"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rojo (for the Roblox plugin build)
        run: |
          set -euxo pipefail
          ROJO_VERSION=7.4.4
          curl -fsSL "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip" -o /tmp/rojo.zip
          unzip -o /tmp/rojo.zip -d /tmp/rojo
          sudo install /tmp/rojo/rojo /usr/local/bin/rojo
          rojo --version

      - name: Install
        run: npm install

      - name: Build all workspaces
        run: npm run build

      - name: Bundle CLI (single JS file)
        run: npm run bundle -w @rotree/cli

      - name: Build Roblox plugin (RoTree.rbxm)
        run: |
          set -euxo pipefail
          cd plugin
          rojo build default.project.json -o RoTree.rbxm
          ls -lh RoTree.rbxm

      - name: Compile standalone binaries (Bun)
        run: |
          set -euxo pipefail
          mkdir -p dist
          bun build cli/dist/rotree.js --compile --target=bun-linux-x64    --outfile dist/rotree-linux-x64
          bun build cli/dist/rotree.js --compile --target=bun-linux-arm64  --outfile dist/rotree-linux-arm64
          bun build cli/dist/rotree.js --compile --target=bun-darwin-x64   --outfile dist/rotree-darwin-x64
          bun build cli/dist/rotree.js --compile --target=bun-darwin-arm64 --outfile dist/rotree-darwin-arm64
          bun build cli/dist/rotree.js --compile --target=bun-windows-x64  --outfile dist/rotree-windows-x64.exe
          ls -lh dist/

      - name: Smoke-test the Linux binary
        run: |
          chmod +x dist/rotree-linux-x64
          ./dist/rotree-linux-x64 version

      - name: SHA256 checksums
        run: |
          cd dist
          sha256sum rotree-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release + upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: RoTree ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/rotree-linux-x64
            dist/rotree-linux-arm64
            dist/rotree-darwin-x64
            dist/rotree-darwin-arm64
            dist/rotree-windows-x64.exe
            dist/SHA256SUMS.txt
            cli/dist/rotree.js
            plugin/RoTree.rbxm
